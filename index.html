<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC博博鱼 - 游戏自媒体</title>
<style>
  :root{
    --bg1:#0f172a; --bg2:#1e293b;
    --accent:#22d3ee; --accent2:#a78bfa;
    --text:#e2e8f0; --muted:#94a3b8;
    --card:rgba(255,255,255,0.06);
    --border:rgba(255,255,255,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    min-height:100vh;
    line-height:1.6;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:48px 20px 80px;
  }
  /* 顶部卡片 */
  .hero{
    text-align:center;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:40px 24px;
    backdrop-filter:blur(12px);
    box-shadow:0 20px 40px rgba(0,0,0,.25);
  }
  .avatar{
    width:128px;height:128px;
    border-radius:50%;
    margin:0 auto 20px;
    padding:4px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#0f172a}
  h1{font-size:28px;font-weight:800;letter-spacing:.5px}
  .role{color:var(--accent);font-weight:600;margin-top:6px;font-size:15px}
  .bio{color:var(--muted);margin-top:16px;font-size:15px;max-width:520px;margin-left:auto;margin-right:auto}

  /* 分区标题 */
  .section-title{
    margin:40px 4px 16px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--muted);
    display:flex;align-items:center;gap:10px;
  }
  .section-title::before{content:"";width:28px;height:2px;background:var(--accent);border-radius:2px}

  /* 链接卡片 */
  .links{display:flex;flex-direction:column;gap:12px}
  .link{
    display:flex;align-items:center;gap:16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 20px;
    text-decoration:none;
    color:var(--text);
    transition:.25s;
  }
  .link:hover{
    transform:translateY(-3px);
    border-color:var(--accent);
    box-shadow:0 10px 24px rgba(34,211,238,.15);
  }
  .link .icon{
    width:44px;height:44px;flex-shrink:0;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    background:rgba(34,211,238,.12);
  }
  .link .info{flex:1;text-align:left;min-width:0}
  .link .label{font-weight:700;font-size:15px}
  .link .value{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 页脚 */
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:56px}
  footer a{color:var(--accent);text-decoration:none}

  @media(max-width:480px){
    .wrap{padding:24px 14px 60px}
    h1{font-size:24px}
    .link{padding:14px 16px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 个人介绍 -->
  <div class="hero">
    <div class="avatar">
      <img src="logo.png" alt="MC博博鱼头像">
    </div>
    <h1>MC博博鱼</h1>
    <div class="role">🎮 游戏自媒体</div>
    <p class="bio">嗨，你好！我是MC博博鱼，一个我的世界主包！</p>
  </div>

  <!-- 联系与账号 -->
  <div class="section-title">联系方式 & 账号</div>
  <div class="links">

    <a class="link" href="https://github.com/CN-Bobofish" target="_blank" rel="noopener">
      <div class="icon">🐙</div>
      <div class="info">
        <div class="label">GitHub</div>
        <div class="value">github.com/CN-Bobofish</div>
      </div>
    </a>

    <a class="link" href="mailto:mc_bobofish@outlook.com">
      <div class="icon">✉️</div>
      <div class="info">
        <div class="label">邮箱 Email</div>
        <div class="value">mc_bobofish@outlook.com</div>
      </div>
    </a>

    <div class="link">
      <div class="icon">💬</div>
      <div class="info">
        <div class="label">微信 WeChat</div>
        <div class="value">LYB-Bobofish</div>
      </div>
    </div>

    <div class="link">
      <div class="icon">🐧</div>
      <div class="info">
        <div class="label">QQ</div>
        <div class="value">1643657550</div>
      </div>
    </div>

    <div class="link">
      <div class="icon">🌐</div>
      <div class="info">
        <div class="label">网络账号</div>
        <div class="value">MC博博鱼</div>
      </div>
    </div>

  </div>

  <footer>
    © <span id="year"></span> MC博博鱼 <br>
  </footer>

</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
